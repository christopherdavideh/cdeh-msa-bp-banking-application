server:
  port: 8083

spring:
  application:
    name: cdeh-msa-bp-banking-application

# Configuración CORS
cors:
  allowed-origins:
    - "http://localhost:4200"
    - "http://localhost:4201"
    - "http://localhost:3000"
    - "http://127.0.0.1:4200"
    - "http://127.0.0.1:4201"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true
  max-age: 3600

application:
  connect-timeout: 5000
  read-timeout: 30000
  max-in-memory-size: 1048576
  url:
    party-service:
      base-url: http://localhost:8080
      path: /clientes
    account-service:
      base-url: http://localhost:8081
      path: /cuentas
    transaction-service:
      base-url: http://localhost:8082
      path: /movimientos

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
